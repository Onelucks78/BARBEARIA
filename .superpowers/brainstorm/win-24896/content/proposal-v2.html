<h2>Proposta de Design v2: Fluxo do Modal de Login</h2>
<p class="subtitle">Mockup do modal com dois botões principais na tela inicial (Google e E-mail/Senha)</p>

<div class="split">
  <!-- Left Side: Initial View -->
  <div class="mockup">
    <div class="mockup-header">Tela Inicial do Modal (Dois Botões Claros)</div>
    <div class="mockup-body" style="background-color: #030712; padding: 24px; min-height: 380px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
      
      <!-- Modal Box -->
      <div style="background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(197, 160, 89, 0.2); border-radius: 8px; padding: 24px; width: 100%; max-width: 320px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);">
        
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 24px;">
          <h4 style="font-family: serif; color: #fff; margin: 0; font-size: 18px; letter-spacing: 0.05em;">Acesse sua Conta</h4>
          <p style="font-size: 9px; color: #c5a059; margin: 4px 0 0 0; text-transform: uppercase; font-family: monospace; letter-spacing: 0.1em;">Barbearia Imperial VIP</p>
        </div>

        <!-- Google Login (Primary) -->
        <button style="width: 100%; padding: 12px; background: #fff; color: #1e293b; border: none; border-radius: 4px; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(255,255,255,0.15); margin-bottom: 12px;">
          <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05" />
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335" />
          </svg>
          Entrar com o Google
        </button>

        <!-- Email & Password Button -->
        <button style="width: 100%; padding: 12px; background: rgba(197, 160, 89, 0.1); color: #c5a059; border: 1px solid rgba(197, 160, 89, 0.4); border-radius: 4px; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: 0.2s;">
          <svg style="width: 16px; height: 16px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          Entrar com E-mail e Senha
        </button>
      </div>

    </div>
  </div>

  <!-- Right Side: Email Input Form View -->
  <div class="mockup">
    <div class="mockup-header">Visualização do Formulário de E-mail (Após Clique)</div>
    <div class="mockup-body" style="background-color: #030712; padding: 24px; min-height: 380px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
      
      <!-- Modal Box -->
      <div style="background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(197, 160, 89, 0.2); border-radius: 8px; padding: 24px; width: 100%; max-width: 320px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);">
        
        <!-- Back Button & Title -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
          <button style="background: transparent; border: none; color: #c5a059; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 4px;">
            &larr; Voltar
          </button>
          <span style="font-size: 11px; color: #fff; font-weight: bold;">Login por E-mail</span>
          <span style="width: 40px;"></span>
        </div>

        <!-- Form fields -->
        <div style="margin-bottom: 12px;">
          <label style="font-size: 8px; color: #94a3b8; text-transform: uppercase; font-family: monospace; display: block; margin-bottom: 4px;">E-mail:</label>
          <input type="email" value="barbeiro@imperial.com" readOnly style="width: 100%; padding: 8px 12px; background: #020617; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; color: #fff; font-size: 11px;" />
        </div>

        <div style="margin-bottom: 16px;">
          <label style="font-size: 8px; color: #94a3b8; text-transform: uppercase; font-family: monospace; display: block; margin-bottom: 4px;">Senha:</label>
          <input type="password" value="••••••••" readOnly style="width: 100%; padding: 8px 12px; background: #020617; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; color: #fff; font-size: 11px;" />
        </div>

        <!-- Action Button -->
        <button style="width: 100%; padding: 10px; background: #c5a059; color: #000; border: none; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer;">
          Entrar na Conta
        </button>
      </div>

    </div>
  </div>
</div>
